plugins {
    id 'com.android.application'
}

// Release signing comes from GitHub secrets (see .github/workflows/build-apk.yml).
// Without them the build falls back to the debug key so CI still works.
def ks = System.getenv('SIGNING_KEYSTORE')
def hasReleaseKey = ks != null && file(ks).exists()

android {
    namespace 'com.moonsiao.promptcue'
    compileSdk 36

    defaultConfig {
        applicationId 'com.moonsiao.promptcue'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
